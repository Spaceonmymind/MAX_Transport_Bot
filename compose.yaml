services:
  max-transport-bot:
    build: .
    container_name: max-transport-bot
    env_file: .env
    restart: unless-stopped
    # Enable only when Nginx runs on this host; choose a vacant host port first.
    # ports:
    #   - "127.0.0.1:8017:8000"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

